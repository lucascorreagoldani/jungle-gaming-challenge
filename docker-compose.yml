version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle_postgres
    restart: always
    environment:
      POSTGRES_DB: jungle_gaming
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jungle -d jungle_gaming" ]
      interval: 3s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3.4
    container_name: jungle_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      test: [ "CMD-SHELL", "awslocal sqs list-queues || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
